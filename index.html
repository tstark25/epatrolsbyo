<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Patroli Digital — Swiss-Belhotel Airport Yogyakarta</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#12161c" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#10141a;
    --panel:#1a212b;
    --panel-2:#212b38;
    --line:#2b3543;
    --text:#eef1f5;
    --text-dim:#8a94a3;
    --amber:#e8a33d;
    --amber-dim:#7a5a24;
    --green:#4fbf80;
    --red:#e2574c;
    --radius:14px;
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(ellipse 700px 400px at 50% -10%, rgba(232,163,61,0.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .app{
    flex:1;
    display:flex;
    flex-direction:column;
    max-width:480px;
    width:100%;
    margin:0 auto;
    padding:20px 18px 28px;
  }

  /* ---- Header ---- */
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
  }
  .brand-mark{
    width:38px;height:38px;
    border-radius:10px;
    background:linear-gradient(135deg, var(--amber), #c97f22);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;color:#1a1206;
    font-size:15px;
    flex-shrink:0;
  }
  .brand-text{line-height:1.25;}
  .brand-text .title{font-weight:700;font-size:15px;}
  .brand-text .sub{font-size:11.5px;color:var(--text-dim);}

  /* ---- Screens ---- */
  .screen{display:none; flex:1; flex-direction:column;}
  .screen.active{display:flex;}

  /* ---- Login ---- */
  .login-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    margin-top:8px;
  }
  .login-card h1{font-size:19px;margin:0 0 4px;}
  .login-card p{margin:0 0 18px;color:var(--text-dim);font-size:13px;}
  label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:6px;letter-spacing:.03em;text-transform:uppercase;}
  select, input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:13px 12px;
    border-radius:10px;
    font-size:15px;
    margin-bottom:16px;
    font-family:var(--font-ui);
  }
  select:focus, input:focus{outline:2px solid var(--amber); border-color:var(--amber);}
  .btn{
    width:100%;
    border:none;
    border-radius:10px;
    padding:15px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    font-family:var(--font-ui);
  }
  .btn-primary{background:var(--amber); color:#1a1206;}
  .btn-primary:active{background:#d1912f;}
  .btn-ghost{background:transparent; color:var(--text-dim); border:1px solid var(--line); margin-top:10px;}
  .error-msg{color:var(--red); font-size:13px; margin:-6px 0 14px; min-height:16px;}

  /* ---- Scan screen ---- */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
  }
  .officer{font-size:13px;}
  .officer .name{font-weight:700;font-size:15px;}
  .officer .role{color:var(--text-dim); font-size:11.5px;}
  .logout-link{color:var(--text-dim); font-size:12.5px; background:none; border:none; text-decoration:underline; cursor:pointer;}

  .scan-zone{
    position:relative;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    aspect-ratio:1/1;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:16px;
  }
  #reader{width:100%; height:100%;}
  #reader video{object-fit:cover;}

  .scan-idle{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    text-align:center;
    padding:24px;
  }
  .torch-ring{
    width:84px;height:84px;
    border-radius:50%;
    border:2px solid var(--amber-dim);
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .torch-ring::after{
    content:'';
    position:absolute;
    inset:-2px;
    border-radius:50%;
    border:2px solid var(--amber);
    opacity:.4;
    animation:sweep 2.4s ease-in-out infinite;
  }
  @keyframes sweep{
    0%,100%{transform:scale(1); opacity:.5;}
    50%{transform:scale(1.15); opacity:0;}
  }
  .torch-ring svg{width:32px;height:32px;stroke:var(--amber);}
  .scan-idle .hint{color:var(--text-dim); font-size:13px; max-width:220px;}

  /* ---- Result banner ---- */
  .result-card{
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:16px;
    display:none;
  }
  .result-card.show{display:block; animation:fadeIn .25s ease;}
  .result-card.success{background:rgba(79,191,128,0.12); border:1px solid rgba(79,191,128,0.4);}
  .result-card.error{background:rgba(226,87,76,0.12); border:1px solid rgba(226,87,76,0.4);}
  .result-card .label{font-size:11px; text-transform:uppercase; letter-spacing:.05em; opacity:.75; margin-bottom:4px;}
  .result-card.success .label{color:var(--green);}
  .result-card.error .label{color:var(--red);}
  .result-card .titik{font-size:17px; font-weight:700; margin-bottom:2px;}
  .result-card .meta{font-size:12.5px; color:var(--text-dim); font-family:var(--font-mono);}
  @keyframes fadeIn{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);}}

  .history{margin-top:auto; padding-top:10px;}
  .history-title{font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px;}
  .history-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .history-item:last-child{border-bottom:none;}
  .history-item .h-titik{font-weight:600;}
  .history-item .h-time{color:var(--text-dim); font-family:var(--font-mono); font-size:11.5px;}

  .footer-note{
    text-align:center; color:var(--text-dim); font-size:11px; margin-top:18px;
  }
</style>
</head>
<body>
<div class="app">

  <div class="brand">
    <div class="brand-mark">SB</div>
    <div class="brand-text">
      <div class="title">Patroli Digital</div>
      <div class="sub">Swiss-Belhotel Airport YIA — Security</div>
    </div>
  </div>

  <!-- ===== LOGIN SCREEN ===== -->
  <div class="screen active" id="screen-login">
    <div class="login-card">
      <h1>Mulai Shift</h1>
      <p>Pilih nama Anda dan masukkan PIN untuk mulai patroli.</p>

      <label for="petugasSelect">Petugas</label>
      <select id="petugasSelect">
        <option value="">Memuat daftar petugas...</option>
      </select>

      <label for="pinInput">PIN</label>
      <input id="pinInput" type="password" inputmode="numeric" maxlength="8" placeholder="••••" />

      <div class="error-msg" id="loginError"></div>

      <button class="btn btn-primary" id="loginBtn">Masuk</button>
    </div>
    <div class="footer-note">Hubungi ITM & AHRM, jika nama Anda belum terdaftar.</div>
  </div>

  <!-- ===== SCAN SCREEN ===== -->
  <div class="screen" id="screen-scan">
    <div class="topbar">
      <div class="officer">
        <div class="name" id="officerName">—</div>
        <div class="role">Sedang bertugas</div>
      </div>
      <button class="logout-link" id="logoutBtn">Ganti petugas</button>
    </div>

    <div class="result-card" id="resultCard">
      <div class="label" id="resultLabel">Status</div>
      <div class="titik" id="resultTitik">—</div>
      <div class="meta" id="resultMeta">—</div>
    </div>

    <div class="scan-zone">
      <div id="reader"></div>
      <div class="scan-idle" id="scanIdle">
        <div class="torch-ring">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        </div>
        <div class="hint">Ketuk tombol di bawah, lalu arahkan kamera ke QR di titik patroli.</div>
      </div>
    </div>

    <button class="btn btn-primary" id="scanBtn">Scan Titik Patroli</button>

    <div class="history">
      <div class="history-title">Riwayat scan (sesi ini)</div>
      <div id="historyList"></div>
    </div>
  </div>

</div>

<script>
  // === ISI URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI ===
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzfNzKCa7tXE15NtRVV9xIS6ctsvZ3-zZBmtIprDscbhA83negRIk5CYcxTCbutlEo2pQ/exec';

  let currentOfficer = null;
  let html5QrCode = null;
  let scanning = false;
  let history = [];

  const el = (id) => document.getElementById(id);

  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    el(id).classList.add('active');
  }

  // ---- Load daftar petugas dari Google Sheet ----
  async function loadPetugas(){
    const select = el('petugasSelect');
    try{
      const res = await fetch(`${GAS_URL}?action=petugas`);
      const list = await res.json();
      select.innerHTML = '<option value="">Pilih nama...</option>' +
        list.map(p => `<option value="${p.id}">${p.nama}</option>`).join('');
    }catch(err){
      select.innerHTML = '<option value="">Gagal memuat — cek koneksi</option>';
    }
  }
  loadPetugas();

  // ---- Login ----
  el('loginBtn').addEventListener('click', async () => {
    const petugasId = el('petugasSelect').value;
    const pin = el('pinInput').value;
    const errBox = el('loginError');
    errBox.textContent = '';

    if(!petugasId || !pin){
      errBox.textContent = 'Pilih nama dan isi PIN terlebih dahulu.';
      return;
    }

    // Verifikasi dilakukan saat scan pertama (server cek petugasId+pin),
    // di sini kita simpan sementara dan tampilkan nama dari dropdown.
    currentOfficer = { id: petugasId, pin, nama: el('petugasSelect').selectedOptions[0].text };
    el('officerName').textContent = currentOfficer.nama;
    history = [];
    renderHistory();
    showScreen('screen-scan');
  });

  el('logoutBtn').addEventListener('click', () => {
    stopScanner();
    currentOfficer = null;
    el('pinInput').value = '';
    showScreen('screen-login');
  });

  // ---- Scan ----
  el('scanBtn').addEventListener('click', () => {
    if(scanning){
      stopScanner();
    }else{
      startScanner();
    }
  });

  function startScanner(){
    el('scanIdle').style.display = 'none';
    el('scanBtn').textContent = 'Batalkan Scan';
    scanning = true;

    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 220, height: 220 } },
      onScanSuccess,
      () => {} // ignore per-frame errors
    ).catch(err => {
      showResult('error', 'Tidak bisa akses kamera', String(err));
      stopScanner();
    });
  }

  function stopScanner(){
    if(html5QrCode && scanning){
      html5QrCode.stop().catch(()=>{});
    }
    scanning = false;
    el('scanIdle').style.display = 'flex';
    el('scanBtn').textContent = 'Scan Titik Patroli';
  }

  async function onScanSuccess(decodedText){
    stopScanner();
    const kodeTitik = extractKodeTitik(decodedText);
    await submitScan(kodeTitik);
  }

  // Menerima hasil scan berupa teks polos ("TTK-01") ATAU URL
  // (misal "https://patroli-yia.app/?titik=TTK-01" atau ".../scan/TTK-01")
  function extractKodeTitik(raw){
    const text = raw.trim();

    // Bukan URL -> pakai apa adanya
    if(!/^https?:\/\//i.test(text)){
      return text;
    }

    try{
      const url = new URL(text);
      // Coba ambil dari query param umum: titik, t, kode, code, id
      const paramKeys = ['titik', 't', 'kode', 'code', 'id'];
      for(const key of paramKeys){
        const val = url.searchParams.get(key);
        if(val) return val;
      }
      // Kalau tidak ada query param, ambil segmen terakhir dari path
      // contoh: https://.../scan/TTK-01 -> "TTK-01"
      const segments = url.pathname.split('/').filter(Boolean);
      if(segments.length > 0) return segments[segments.length - 1];
    }catch(e){
      // bukan URL valid, fallback ke teks asli
    }

    return text;
  }

  async function submitScan(kodeTitik){
    try{
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({
          petugasId: currentOfficer.id,
          pin: currentOfficer.pin,
          kodeTitik
        })
      });
      const data = await res.json();

      if(data.status === 'success'){
        showResult('success', data.data.titik, data.data.waktu);
        history.unshift({ titik: data.data.titik, waktu: data.data.waktu });
        renderHistory();
      }else{
        showResult('error', 'Scan ditolak', data.message);
      }
    }catch(err){
      showResult('error', 'Gagal mengirim data', 'Cek koneksi internet, lalu coba lagi.');
    }
  }

  function showResult(type, titik, meta){
    const card = el('resultCard');
    card.className = `result-card show ${type}`;
    el('resultLabel').textContent = type === 'success' ? 'Berhasil dicatat' : 'Gagal';
    el('resultTitik').textContent = titik;
    el('resultMeta').textContent = meta;
  }

  function renderHistory(){
    const list = el('historyList');
    if(history.length === 0){
      list.innerHTML = '<div style="color:var(--text-dim); font-size:12.5px;">Belum ada scan pada sesi ini.</div>';
      return;
    }
    list.innerHTML = history.map(h => `
      <div class="history-item">
        <div class="h-titik">${h.titik}</div>
        <div class="h-time">${h.waktu}</div>
      </div>
    `).join('');
  }
</script>
</body>
</html>
